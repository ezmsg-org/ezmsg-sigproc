[project]
name = "ezmsg-sigproc"
description = "Timeseries signal processing implementations in ezmsg"
authors = [
  { name = "Griffin Milsap", email = "griffin.milsap@gmail.com" },
  { name = "Preston Peranich", email = "pperanich@gmail.com" },
  { name = "Chadwick Boulay", email = "chadwick.boulay@gmail.com" },
  { name = "Kyle McGraw", email = "kmcgraw@blackrockneuro.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "array-api-compat>=1.11.1",
  "ezmsg[axisarray]>=3.10.0b4",
  "ezmsg-baseproc>=1.13.0",
  "mlx>=0.18.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numba>=0.61.0",
  "numpy>=1.26.0",
  "pywavelets>=1.6.0",
  "scipy>=1.13.1",
  "sparse>=0.15.4",
]

[project.entry-points."ezmsg.components"]
"sigproc.Abs" = "ezmsg.sigproc.math.abs:Abs"
"sigproc.Activation" = "ezmsg.sigproc.activation:Activation"
"sigproc.AdaptiveLNC" = "ezmsg.sigproc.adaptive_lnc:AdaptiveLNC"
"sigproc.AdaptiveStandardScaler" = "ezmsg.sigproc.scaler:AdaptiveStandardScaler"
"sigproc.Add" = "ezmsg.sigproc.math.add:Add"
"sigproc.AffineTransform" = "ezmsg.sigproc.affinetransform:AffineTransform"
"sigproc.AggregateUnit" = "ezmsg.sigproc.aggregate:AggregateUnit"
"sigproc.AlignAlongAxis" = "ezmsg.sigproc.align:AlignAlongAxis"
"sigproc.Anscombe" = "ezmsg.sigproc.math.anscombe:Anscombe"
"sigproc.AsArray" = "ezmsg.sigproc.asarray:AsArray"
"sigproc.BandPower" = "ezmsg.sigproc.bandpower:BandPower"
"sigproc.BinnedAggregate" = "ezmsg.sigproc.binned_aggregate:BinnedAggregate"
"sigproc.ButterworthFilter" = "ezmsg.sigproc.butterworthfilter:ButterworthFilter"
"sigproc.ButterworthZeroPhase" = "ezmsg.sigproc.butterworthzerophase:ButterworthZeroPhase"
"sigproc.CWT" = "ezmsg.sigproc.wavelets:CWT"
"sigproc.ChebyForDecimate" = "ezmsg.sigproc.decimate:ChebyForDecimate"
"sigproc.ChebyshevFilter" = "ezmsg.sigproc.cheby:ChebyshevFilter"
"sigproc.Clip" = "ezmsg.sigproc.math.clip:Clip"
"sigproc.CombFilterUnit" = "ezmsg.sigproc.combfilter:CombFilterUnit"
"sigproc.CommonRereference" = "ezmsg.sigproc.affinetransform:CommonRereference"
"sigproc.Concat" = "ezmsg.sigproc.concat:Concat"
"sigproc.ConstAdd" = "ezmsg.sigproc.math.add:ConstAdd"
"sigproc.ConstDifference" = "ezmsg.sigproc.math.difference:ConstDifference"
"sigproc.CoordinateSpaces" = "ezmsg.sigproc.coordinatespaces:CoordinateSpaces"
"sigproc.Decimate" = "ezmsg.sigproc.decimate:Decimate"
"sigproc.DenormalizeUnit" = "ezmsg.sigproc.denormalize:DenormalizeUnit"
"sigproc.DetrendUnit" = "ezmsg.sigproc.detrend:DetrendUnit"
"sigproc.DiffUnit" = "ezmsg.sigproc.diff:DiffUnit"
"sigproc.Difference" = "ezmsg.sigproc.math.difference:Difference"
"sigproc.Digitize" = "ezmsg.sigproc.digitize:Digitize"
"sigproc.Downsample" = "ezmsg.sigproc.downsample:Downsample"
"sigproc.EWM" = "ezmsg.sigproc.ewmfilter:EWM"
"sigproc.EWMAUnit" = "ezmsg.sigproc.ewma:EWMAUnit"
"sigproc.EWMFilter" = "ezmsg.sigproc.ewmfilter:EWMFilter"
"sigproc.ExtractAxisDataUnit" = "ezmsg.sigproc.extract_axis:ExtractAxisDataUnit"
"sigproc.FBCCA" = "ezmsg.sigproc.fbcca:FBCCA"
"sigproc.FIRFilter" = "ezmsg.sigproc.firfilter:FIRFilter"
"sigproc.FIRHilbertEnvelopeUnit" = "ezmsg.sigproc.fir_hilbert:FIRHilbertEnvelopeUnit"
"sigproc.FIRHilbertFilterUnit" = "ezmsg.sigproc.fir_hilbert:FIRHilbertFilterUnit"
"sigproc.Filter" = "ezmsg.sigproc.filter:Filter"
"sigproc.Filterbank" = "ezmsg.sigproc.filterbank:Filterbank"
"sigproc.Flatten" = "ezmsg.sigproc.flatten:Flatten"
"sigproc.GaussianSmoothingFilter" = "ezmsg.sigproc.gaussiansmoothing:GaussianSmoothingFilter"
"sigproc.InverseAnscombe" = "ezmsg.sigproc.math.anscombe:InverseAnscombe"
"sigproc.Invert" = "ezmsg.sigproc.math.invert:Invert"
"sigproc.KaiserFilter" = "ezmsg.sigproc.kaiser:KaiserFilter"
"sigproc.LinearTransform" = "ezmsg.sigproc.linear:LinearTransform"
"sigproc.Log" = "ezmsg.sigproc.math.log:Log"
"sigproc.Materialize" = "ezmsg.sigproc.materialize:Materialize"
"sigproc.Merge" = "ezmsg.sigproc.merge:Merge"
"sigproc.ParksMcClellanFIR" = "ezmsg.sigproc.fir_pmc:ParksMcClellanFIR"
"sigproc.Pow" = "ezmsg.sigproc.math.pow:Pow"
"sigproc.QuantizerUnit" = "ezmsg.sigproc.quantize:QuantizerUnit"
"sigproc.RMSBandPower" = "ezmsg.sigproc.singlebandpow:RMSBandPower"
"sigproc.RangedAggregate" = "ezmsg.sigproc.aggregate:RangedAggregate"
"sigproc.ResampleConcat" = "ezmsg.sigproc.resampleconcat:ResampleConcat"
"sigproc.ResampleUnit" = "ezmsg.sigproc.resample:ResampleUnit"
"sigproc.RollingScalerUnit" = "ezmsg.sigproc.rollingscaler:RollingScalerUnit"
"sigproc.Sampler" = "ezmsg.sigproc.sampler:Sampler"
"sigproc.Scale" = "ezmsg.sigproc.math.scale:Scale"
"sigproc.SignalInjector" = "ezmsg.sigproc.signalinjector:SignalInjector"
"sigproc.Slicer" = "ezmsg.sigproc.slicer:Slicer"
"sigproc.Spectrogram" = "ezmsg.sigproc.spectrogram:Spectrogram"
"sigproc.Spectrum" = "ezmsg.sigproc.spectrum:Spectrum"
"sigproc.SquareLawBandPower" = "ezmsg.sigproc.singlebandpow:SquareLawBandPower"
"sigproc.StreamingFBCCA" = "ezmsg.sigproc.fbcca:StreamingFBCCA"
"sigproc.Transpose" = "ezmsg.sigproc.transpose:Transpose"
"sigproc.TriggerGenerator" = "ezmsg.sigproc.sampler:TriggerGenerator"
"sigproc.Window" = "ezmsg.sigproc.window:Window"

[dependency-groups]
dev = [
  "typer>=0.12.5",
  "pre-commit>=4.2.0",
  "jupyter>=1.1.1",
  "scipy-stubs>=1.15.3.0",
  "matplotlib>=3.10.8",
  {include-group = "lint"},
  {include-group = "test"},
  {include-group = "docs"},
]
lint = [
  "ruff==0.16.2"
]
test = [
  "frozendict>=2.4.4",
  "pytest-asyncio>=0.24.0",
  "pytest-benchmark>=5.2.3",
  "pytest-cov>=5.0.0",
  "pytest>=8.3.3",
  "torch>=2.11.0",
]
docs = [
  "sphinx>=8.1.3",
  "pydata-sphinx-theme",
  "sphinx_autodoc_typehints>=3.0.0",
  "sphinx_copybutton",
  "myst_parser",
  "sphinxcontrib-mermaid",
]
profile = [
  "snakeviz>=2.2.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ezmsg/sigproc/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmsg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = "tests/helpers"
addopts = "-p no:warnings --benchmark-group-by=group,param:n_channels -m 'not sosfilt'"
markers = [
  "sosfilt: marks sosfilt development benchmarks (deselected by default, run with: -m sosfilt)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Exclude auto-generated files
exclude = ["*/__version__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["ezmsg.sigproc"]
known-third-party = ["ezmsg", "ezmsg.baseproc"]

[tool.uv.sources]
# Uncomment to use development version of ezmsg from git
#ezmsg = { git = "https://github.com/ezmsg-org/ezmsg.git", branch = "dev" }
